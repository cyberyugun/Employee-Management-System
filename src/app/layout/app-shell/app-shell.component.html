<div class="shell">
  <aside
    id="app-sidebar"
    class="sidebar"
    [class.sidebar--open]="isMobileMenuOpen()"
  >
    <a class="brand" routerLink="/app/employees" aria-label="PeopleFlow home" (click)="closeMobileMenu()">
      <span class="brand__mark">P</span>
      <span class="brand__name">{{ appName }}<small>WORKSPACE</small></span>
    </a>

    <div class="sidebar__label">WORKSPACE</div>
    <nav class="navigation" aria-label="Main navigation">
      <a
        class="navigation__link"
        routerLink="/app/employees"
        routerLinkActive="navigation__link--active"
        (click)="closeMobileMenu()"
      >
        <span class="navigation__icon" aria-hidden="true">▦</span>
        <span>Employees</span>
      </a>
    </nav>

    <div class="sidebar__bottom">
      <div class="user-card">
        <div class="avatar" aria-hidden="true">AD</div>
        <div class="user-card__info"><strong>Admin User</strong><span>Administrator</span></div>
        <button type="button" class="logout-button" aria-label="Log out" title="Log out" (click)="logout()">↗</button>
      </div>
    </div>
  </aside>

  @if (isMobileMenuOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeMobileMenu()"
    ></button>
  }

  <main class="main-content">
    <header class="topbar">
      <div class="topbar__left">
        <button
          class="menu-toggle"
          type="button"
          [attr.aria-label]="isMobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
          [attr.aria-expanded]="isMobileMenuOpen()"
          aria-controls="app-sidebar"
          (click)="toggleMobileMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="topbar__crumb"><span>Workspace</span><span class="topbar__slash">/</span><strong>People</strong></div>
      </div>
      <div class="topbar__right"><span class="live-dot"></span><span>All systems operational</span><span class="topbar__avatar">AD</span></div>
    </header>
    <section class="page-content">
      <router-outlet />
    </section>
    <footer class="footer"><span>© 2026 {{ appName }}</span><span>People operations, made simpler.</span></footer>
  </main>
</div>
